name: Docker Build and Deploy to Render

on:
  push:
    branches: [ "with-db" ]

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Получаем код из репозитория

      - name: Set up JDK 21  # Устанавливаем Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew  # Даем права на выполнение

      - name: Build with Gradle  # Собираем JAR без тестов
        run: ./gradlew bootJar -x test

      - name: Login to Docker Hub  # Аутентификация в Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Backend Docker image  # Сборка и публикация образа
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/demo-deployment:latest

      - name: Trigger Render Deploy for Backend  # Запуск деплоя на Render
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/vnd.render+json; version=2021-06-01" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys"

  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-deploy-backend  # Ожидает завершения сборки бэкенда
    steps:
      - uses: actions/checkout@v4  # Получаем код из репозитория

      - name: Set up Node.js  # Устанавливаем Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Login to Docker Hub  # Аутентификация в Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Frontend Docker image  # Сборка и публикация образа
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.frontend  # Используем отдельный Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/frontend:latest

      - name: Trigger Render Deploy for Frontend  # Запуск деплоя на Render
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/vnd.render+json; version=2021-06-01" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_FRONTEND_SERVICE_ID }}/deploys"